# RoboDojo dual-arm action-policy SFT on Cosmos3-Edge.
# Env: ROBODOJO_ROOT, BASE_CHECKPOINT_PATH, WAN_VAE_PATH, IMAGINAIRE_OUTPUT_ROOT.

[job]
task         = "vfm"
experiment   = "action_policy_robodojo_edge"
project      = "cosmos3_action_robodojo"
group        = "action_sft"
name         = "action_policy_robodojo_edge"
wandb_mode   = "disabled"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = 74000

[model.parallelism]
data_parallel_shard_degree     = 4
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode           = "selective"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5.0e-05

[scheduler]
cycle_lengths = [60000]
warm_up_steps = [500]

[dataloader_train]
max_samples_per_batch = 64

[trainer]
max_iter        = 60000
logging_iter    = 50
grad_accum_iter = 1 # effective global batch = 64 samples/rank x 4 ranks = 256

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 2000