# LIBERO-10 action-policy SFT on Cosmos3-Edge. The companion Python entrypoint
# registers `action_policy_libero_edge` from the framework's Edge model config.
# Env: LIBERO_ROOT, BASE_CHECKPOINT_PATH, WAN_VAE_PATH, IMAGINAIRE_OUTPUT_ROOT.

[job]
task         = "vfm"
experiment   = "action_policy_libero_edge"
project      = "cosmos3_action_libero"
group        = "action_sft"
name         = "action_policy_libero_10_edge"
wandb_mode   = "disabled"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = 74000

[model.parallelism]
data_parallel_shard_degree     = 8
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode           = "selective"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5.0e-05

[scheduler]
cycle_lengths = [16000]
warm_up_steps = [500]

[trainer]
max_iter        = 2000
logging_iter    = 50
grad_accum_iter = 2       # 128 samples x 8 ranks x 2 = global batch 2048

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 500