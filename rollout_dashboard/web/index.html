<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoboLab Chunk Review</title>
  <link rel="stylesheet" href="/assets/review.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div><strong>CHUNK REVIEW</strong><small>RoboLab action playback</small></div>
    </div>
    <div class="top-actions">
      <label class="run-picker"><span>RUN</span><select id="run-select" aria-label="选择 rollout"></select></label>
      <button id="refresh" class="icon-button" title="立即刷新" aria-label="立即刷新">↻</button>
    </div>
  </header>

  <main class="review-main">
    <section class="review-heading">
      <div>
        <div class="status-line"><span id="status-dot" class="status-dot"></span><span id="status">CONNECTING</span></div>
        <h1 id="task">Waiting for rollout</h1>
      </div>
      <div class="review-summary">
        <span id="chunk-count">0 CHUNKS</span>
        <span id="steps">0 STEPS</span>
        <span id="native-result">PENDING</span>
      </div>
    </section>
    <section id="chunks" class="review-grid" aria-live="polite"></section>
  </main>
  <script src="/assets/review.js"></script>
</body>
</html>
