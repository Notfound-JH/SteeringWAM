<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoboLab Rollout Live</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div><strong>ROLLOUT LIVE</strong><small>RoboLab telemetry</small></div>
    </div>
    <div class="top-actions">
      <label class="run-picker"><span>RUN</span><select id="run-select" aria-label="选择 rollout"></select></label>
      <label class="live-toggle"><input id="live-toggle" type="checkbox" checked><span></span>LIVE</label>
      <button id="refresh" class="icon-button" title="立即刷新" aria-label="立即刷新">↻</button>
    </div>
  </header>

  <main>
    <section class="status-band">
      <div class="run-heading">
        <div class="status-line"><span id="status-dot" class="status-dot"></span><span id="status">CONNECTING</span></div>
        <h1 id="task">Waiting for rollout</h1>
        <p id="instruction">正在连接 diagnostics 数据源</p>
      </div>
      <dl class="metrics">
        <div><dt>STEPS</dt><dd id="steps">0</dd></div>
        <div><dt>CHUNKS</dt><dd id="chunk-count">0</dd></div>
        <div><dt>INFERENCE</dt><dd id="inference">--</dd></div>
        <div><dt>NATIVE RESULT</dt><dd id="native-result">--</dd></div>
      </dl>
    </section>

    <section class="workspace">
      <div class="viewer-column">
        <div class="camera-tabs" id="camera-tabs"></div>
        <div class="viewport" id="viewport">
          <img id="frame" alt="Rollout camera frame">
          <div id="empty-frame" class="empty-frame">WAITING FOR FIRST FRAME</div>
          <div class="frame-overlay"><span id="frame-label">--</span><span id="frame-time">--</span></div>
        </div>
        <div class="timeline-wrap">
          <div class="timeline-head"><span>SAMPLE TIMELINE</span><span id="timeline-position">0 / 0</span></div>
          <div id="timeline" class="timeline"></div>
        </div>
      </div>

      <aside class="side-panel">
        <section>
          <div class="section-title"><h2>PLANNING CHUNKS</h2><span id="gpu">GPU --</span></div>
          <div id="chunks" class="chunks"></div>
        </section>
        <section class="log-section">
          <div class="section-title"><h2>RUNTIME LOG</h2><span id="updated">--</span></div>
          <pre id="log">Waiting for output...</pre>
        </section>
      </aside>
    </section>
  </main>
  <script src="/assets/app.js"></script>
</body>
</html>
