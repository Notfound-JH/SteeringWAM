<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoboLab · 六路采样</title>
<style>
:root{font-family:"IBM Plex Sans","Noto Sans SC",sans-serif;color:#202b2b;background:#f2f5f4;letter-spacing:0;--line:#d4dedb;--green:#087c64}*{box-sizing:border-box}body{margin:0}header{padding:20px 24px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:22px;flex-wrap:wrap}h1{font-size:24px;margin:0}header small{color:#586863}label{display:flex;align-items:center;gap:6px}#status{margin-left:auto;font-size:13px}#error{color:#a42e31;padding:0 24px}main{padding:20px 24px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}article{min-width:0;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}.heading{padding:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}h2{font-size:18px;margin:0}.badge{font-size:12px;color:#576460}.badge.live{color:var(--green)}.media{aspect-ratio:16/9;background:#182320;display:grid;place-items:center;color:#bdcbc5;overflow:hidden}.media img,.media video{width:100%;height:100%;object-fit:contain;min-height:0}.controls{display:flex;gap:8px;padding:12px 14px}select{min-width:0;max-width:100%;flex:1;padding:7px;border:1px solid var(--line);border-radius:4px;background:white;color:inherit}.metrics{padding:0 14px 12px;display:flex;gap:14px;font-size:13px;color:#40554d}progress{width:calc(100% - 28px);margin:0 14px 12px;accent-color:var(--green);height:6px}.progress{margin:0 14px 14px;font-size:13px;line-height:1.6;max-height:140px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}details{border-top:1px solid var(--line);padding:10px 14px;font-size:13px}summary{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto;font-size:12px;line-height:1.5}a{color:var(--green)}.empty{padding:36px} @media(max-width:1100px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){main{grid-template-columns:1fr;padding:12px}header{padding:16px;gap:12px}#status{margin-left:0;width:100%}}
</style>
<header><div><h1>RoboLab · 六路采样</h1><small id="session">读取任务中</small></div><label><input id="auto" type="checkbox" checked>自动刷新</label><span id="status"></span></header>
<p id="error" role="status"></p><main id="tasks"></main>
<script>
const names={fruits:'水果',tools:'工具',blocks:'积木',black_items:'黑色物品',organic:'有机物',toys:'玩具'};
const cameras={wrist_cam:'腕部',egocentric_mirrored_camera:'场景',over_shoulder_left_camera:'左肩',over_shoulder_right_camera:'右肩',head_camera:'头部'};
const cards=new Map();
function node(tag,text,cls){const element=document.createElement(tag);if(text!==undefined)element.textContent=text;if(cls)element.className=cls;return element}
function detail(title){const element=node('details');element.append(node('summary',title));const content=node('pre');element.append(content);return [element,content]}
function create(task){const card=node('article');const heading=node('div',undefined,'heading');heading.append(node('h2',names[task.task]||task.task));const badge=node('span',undefined,'badge');heading.append(badge);const media=node('div',undefined,'media');const controls=node('div',undefined,'controls');const candidate=node('select');candidate.setAttribute('aria-label',(names[task.task]||task.task)+'候选');const camera=node('select');camera.setAttribute('aria-label','相机');controls.append(candidate,camera);const metrics=node('div',undefined,'metrics');const bar=node('progress');const progress=node('p',undefined,'progress');const [logs,log]=detail('控制者日志');const [choices,selection]=detail('选择记录');const [instructions,instruction]=detail('当前指令');card.append(heading,media,controls,metrics,bar,progress,instructions,choices,logs);document.querySelector('#tasks').append(card);const state={card,badge,media,candidate,camera,metrics,bar,progress,log,selection,instruction,task,mediaKey:null};candidate.onchange=()=>{state.pinned=true;show(state)};camera.onchange=()=>show(state);cards.set(task.task,state);return state}
function options(select,values,selected){select.replaceChildren(...values.map(([value,label])=>{const option=node('option',label);option.value=value;return option}));select.value=values.some(item=>item[0]===selected)?selected:(values[0]?.[0]||'')}
function show(state){const item=state.task.candidates.find(item=>item.key===state.candidate.value);const previous=state.camera.value;const available=[...new Set([...Object.keys(item?.videos||{}),...Object.keys(item?.frames||{})])];options(state.camera,available.map(key=>[key,cameras[key]||key]),previous||'egocentric_mirrored_camera');const camera=state.camera.value;const video=item?.videos[camera];const image=item?.frames[camera];const key=video||image||'empty';if(state.mediaKey!==key){state.mediaKey=key;state.media.replaceChildren();if(video){const element=node('video');element.src=video;element.controls=true;element.muted=true;element.loop=true;element.playsInline=true;element.preload='metadata';if(image)element.poster=image;state.media.append(element)}else if(image){const element=node('img');element.src=image;element.alt=(names[state.task.task]||state.task.task)+' '+(cameras[camera]||camera);state.media.append(element)}else state.media.append(node('span','等待相机画面'));}state.instruction.textContent=JSON.stringify(item?.instruction||{},null,2)}
async function refresh(){try{const response=await fetch('/api/six',{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();document.querySelector('#session').textContent=data.session||'暂无六路实验';document.querySelector('#status').textContent=`SAS ${data.sync.status||'未知'} · ${data.sync.uploaded_files||0} 文件 · ${new Date().toLocaleTimeString()}`;document.querySelector('#error').textContent=data.sync.errors?.length?'同步存在错误，请检查同步日志':'';for(const task of data.tasks){const state=cards.get(task.task)||create(task);state.task=task;state.badge.textContent=task.simulator?'仿真运行中':task.active?'控制者运行中':'控制者已退出';state.badge.className='badge'+(task.active||task.simulator?' live':'');state.metrics.textContent=`GPU ${task.gpu} · 候选完成 ${task.completed} · 选择记录 ${task.selections.length}/${task.limit}`;state.bar.max=task.limit;state.bar.value=task.selections.length;state.progress.textContent=task.progress||'等待进度记录';state.log.textContent=task.console;state.selection.textContent=JSON.stringify(task.selections,null,2);const selected=state.pinned?state.candidate.value:task.candidates.at(-1)?.key;options(state.candidate,[...task.candidates].reverse().map(item=>[item.key,item.key+(item.complete?' · 完成':' · 图像')]),selected);show(state)}}catch(error){document.querySelector('#error').textContent='刷新失败，保留上次画面：'+error.message}}
async function refreshLoop(){if(document.querySelector('#auto').checked)await refresh();setTimeout(refreshLoop,5000)}
refreshLoop();
</script>
</html>
